<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TutorApp</title>
<meta name="description" content="Управление репетиторством: расписание, ученики, финансы"/>
<meta name="theme-color" content="#1f242b"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='24' fill='%230a0a0a'/><text x='96' y='140' text-anchor='middle' font-size='120' font-family='sans-serif' font-weight='900' fill='%23FFE500'>T</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;700;900&family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
if (location.protocol !== 'file:') {
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = 'manifest.json';
  document.head.appendChild(manifestLink);
}
</script>
<style>
:root {
  color-scheme: light;
  --black: #111111;
  --white: #fffdf2;
  --yellow: #ffd83d;
  --red: #ff5a5f;
  --green: #00c781;
  --blue: #4d73ff;
  --border: 2px solid #111111;
  --shadow: 4px 4px 0 #111111;
  --shadow-lg: 7px 7px 0 #111111;
  --text-sec: #555a64;
  --text-muted: #858b94;
  --bg-subtle: #fff0a8;
  --bg-danger: #ffe1dd;
  --bg-success: #d6ffe6;
  --border-light: #111111;
  --border-dashed: #111111;
  --done-bg: #eeeeea;
  --done-text: #686b71;
  --surface: #ffffff;
  --focus: #4d73ff;
}
body[data-theme="dark"] {
  color-scheme: dark;
  --black: #f1eadb;
  --white: #151513;
  --yellow: #dec35a;
  --red: #c56a63;
  --green: #66a77c;
  --blue: #7897d6;
  --border: 2px solid rgba(241,234,219,.72);
  --shadow: 4px 4px 0 rgba(0,0,0,.85);
  --shadow-lg: 7px 7px 0 rgba(0,0,0,.9);
  --text-sec: #c5bcad;
  --text-muted: #91887b;
  --bg-subtle: #29251b;
  --bg-danger: #2b1d1b;
  --bg-success: #19271e;
  --border-light: #3a352d;
  --border-dashed: #5a5145;
  --done-bg: #25231f;
  --done-text: #aaa195;
  --surface: #1e1c18;
  --focus: #7aa2ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Inter', 'Martian Mono', sans-serif;
  background: var(--white);
  color: var(--black);
  min-height: 100dvh;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
body[data-theme="dark"] {
  background: #151513;
  color: #f1eadb;
}
h1,h2,h3,.heading { font-family: 'Unbounded', cursive; }
button, input, select, textarea, a, [role="button"] { outline: none; }
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
a:focus-visible,
[role="button"]:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent);
  outline-offset: 2px;
}

/* NAV BAR */
.navbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; background: var(--black);
  z-index: 100; border-top: var(--border);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 10px 4px 14px;
  color: #888; border: none; background: none; cursor: pointer;
  font-family: 'Martian Mono', monospace; font-size: 9px;
  gap: 4px; transition: color .15s;
  border-right: 1px solid #222;
}
.nav-btn:last-child { border-right: none; }
.nav-btn.active { color: var(--yellow); }
.nav-btn svg { width: 22px; height: 22px; stroke-width: 2px; }
body[data-theme="dark"] .navbar { background: #181713; border-top-color: rgba(241,234,219,.5); }
body[data-theme="dark"] .nav-btn { color: #958c7e; border-right-color: #312c24; }
body[data-theme="dark"] .nav-btn.active { color: var(--yellow); }

/* MAIN */
.main { padding: 16px 16px 90px; max-width: 480px; margin: 0 auto; transition: opacity .2s ease; overflow-x: hidden; }

/* CARDS */
.card {
  background: var(--surface);
  border: var(--border);
  box-shadow: var(--shadow);
  border-radius: 5px;
  margin-bottom: 12px;
}
.card-header {
  background: var(--black); color: var(--yellow);
  font-family: 'Unbounded', cursive; font-size: 11px;
  padding: 8px 12px; letter-spacing: .05em; text-transform: uppercase;
}

/* LESSON CARD */
.lesson-card {
  display: flex; align-items: stretch;
  border: var(--border); box-shadow: var(--shadow);
  border-radius: 5px; margin-bottom: 10px;
  background: var(--surface); overflow: hidden;
  position: relative;
  cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.lesson-card:hover { transform: translate(-1px,-1px); box-shadow: 6px 6px 0 var(--black); }
.lesson-card:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--black); }
.lesson-time {
  min-width: 62px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; background: var(--black); color: var(--yellow);
  font-family: 'Unbounded', cursive; font-size: 14px; font-weight: 700;
  padding: 12px 8px; line-height: 1.2;
}
.lesson-body { flex: 1; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.lesson-name { font-family: 'Unbounded', cursive; font-size: 12px; font-weight: 700; line-height: 1.3; }
.lesson-tag {
  display: inline-block; font-size: 9px; font-weight: 700;
  padding: 2px 6px; border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
  border-radius: 5px; text-transform: uppercase; letter-spacing: .05em;
}
.lesson-actions { display: flex; align-items: center; padding: 0 8px; gap: 6px; }
.lesson-note-dot{
  width:9px;height:9px;border-radius:50%;background:var(--red);
  border:2px solid var(--black);box-shadow:1px 1px 0 var(--black);flex:0 0 auto;
}
.lesson-card .lesson-note-dot{position:absolute;top:8px;right:8px}
.lesson-markers{position:absolute;top:6px;right:6px;display:flex;gap:4px;align-items:center;z-index:1}
.lesson-marker-dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--black);box-shadow:1px 1px 0 var(--black)}
.lesson-marker-note{background:var(--red)}
.lesson-marker-conflict{background:var(--yellow)}
.lesson-marker-debt{background:var(--red)}

/* BUTTONS */
.btn {
  font-family: 'Unbounded', cursive; font-weight: 700;
  border: var(--border); box-shadow: var(--shadow);
  border-radius: 5px; cursor: pointer; transition: transform .1s, box-shadow .1s, background .1s;
  font-size: 12px; padding: 10px 16px; background: var(--yellow); color: var(--black);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn-sm { font-size: 10px; padding: 6px 10px; box-shadow: 3px 3px 0 var(--black); }
.btn-sm:active { transform: translate(3px,3px); box-shadow: 0 0 0; }
.btn-red { background: var(--red); color: var(--white); }
.btn-green { background: var(--green); color: var(--black); }
.btn-black { background: var(--black); color: var(--yellow); }
.btn-white { background: var(--white); color: var(--black); }
.btn-blue { background: var(--blue); color: var(--white); }
.btn-full { width: 100%; justify-content: center; }
body[data-theme="dark"] .btn { box-shadow: var(--shadow); }
body[data-theme="dark"] .btn-blue { background:#3f5482; color:#f5f6fb; }
body[data-theme="dark"] .btn-red { background:#7c403b; color:#fff0ed; }
body[data-theme="dark"] .btn-green { background:#385f47; color:#eefaf2; }
body[data-theme="dark"] .btn-white { background:#24211c; color:#f1eadb; }
body[data-theme="dark"] .btn-black { background:#f1eadb; color:#17130d; }

/* FAB */
.fab {
  position: fixed; right: 16px; bottom: 76px;
  width: 56px; height: 56px; border-radius: 12px;
  background: var(--yellow); border: var(--border);
  box-shadow: var(--shadow-lg); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 99; transition: transform .1s, box-shadow .1s;
}
.fab:active { transform: translate(6px,6px); box-shadow: 0 0 0; }
.fab svg { width: 28px; height: 28px; stroke: var(--black); stroke-width: 2.5; }

/* BADGE */
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'Unbounded', cursive; font-size: 9px; font-weight: 900;
  min-width: 20px; height: 20px; padding: 0 5px;
  border: var(--border); border-radius: 6px;
}
.badge-red { background: var(--red); color: var(--white); }
.badge-green { background: var(--green); color: var(--black); }
.badge-yellow { background: var(--yellow); color: var(--black); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  background: var(--surface); border-top: var(--border);
  border-left: var(--border); border-right: var(--border);
  width: 100%; max-width: 480px; border-radius: 12px 12px 0 0;
  max-height: 90dvh; overflow-y: auto; padding: 20px 16px 32px;
}
.modal-title {
  font-family: 'Unbounded', cursive; font-size: 16px; font-weight: 900;
  margin-bottom: 16px; padding-bottom: 12px; border-bottom: var(--border);
}

/* INPUTS */
.input {
  width: 100%; font-family: 'Martian Mono', monospace; font-size: 14px;
  border: var(--border); border-radius: 7px; padding: 10px 12px;
  background: var(--surface); color: var(--black); outline: none;
  box-shadow: none;
}
.input:focus { background: #fff; border-color: color-mix(in srgb, var(--blue) 55%, var(--border-light)); }
body[data-theme="dark"] .input:focus { background: #191919; }
body[data-theme="dark"] .label,
body[data-theme="dark"] .stat-label,
body[data-theme="dark"] [style*="color:'#666'"],
body[data-theme="dark"] [style*="color:#666"],
body[data-theme="dark"] [style*="color: '#666'"] {
  color: #9b9488 !important;
}
.label {
  font-family: 'Unbounded', cursive; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em;
  display: block; margin-bottom: 6px;
}

/* STAT CARDS */
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-card {
  border: var(--border); box-shadow: var(--shadow); border-radius: 8px;
  padding: 12px; background: var(--surface);
}
.stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: #666; margin-bottom: 4px; }
.stat-value { font-family: 'Unbounded', cursive; font-size: 22px; font-weight: 900; line-height: 1; }

/* PAGE TITLE */
.page-title {
  font-family: 'Unbounded', cursive; font-size: 22px; font-weight: 900;
  margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
  gap:10px; flex-wrap:wrap;
}

/* DAY SELECTOR */
.day-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.day-strip::-webkit-scrollbar { display: none; }
.day-btn {
  min-width: 52px; flex-shrink: 0; display: flex; flex-direction: column;
  align-items: center; padding: 8px 4px; border: var(--border);
  border-radius: 8px; cursor: pointer; background: var(--surface);
  font-family: 'Unbounded', cursive; transition: transform .1s, box-shadow .1s;
  box-shadow: var(--shadow);
}
.day-btn.active { background: var(--black); color: var(--yellow); }
.day-btn:active { transform: translate(3px,3px); box-shadow: 0 0 0; }
.day-btn-name { font-size: 10px; font-weight: 700; }
.day-btn-date { font-size: 14px; font-weight: 900; }
.day-btn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); margin-top: 3px; }

/* STUDENT LIST ITEM */
.student-item {
  border: var(--border); box-shadow: var(--shadow); border-radius: 8px;
  padding: 12px; margin-bottom: 10px; background: var(--surface);
  display: flex; align-items: center; justify-content: space-between;
}

/* TOGGLE */
.toggle-row { display: flex; gap: 0; border: var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 12px; background:var(--surface); }
.toggle-opt {
  flex: 1; padding: 8px; text-align: center; cursor: pointer;
  font-family: 'Unbounded', cursive; font-size: 10px; font-weight: 700;
  border: none; background: var(--surface); border-right: var(--border);
  transition: background .1s;
}
.toggle-opt:last-child { border-right: none; }
.toggle-opt.active { background: var(--black); color: var(--yellow); }

/* CHECKBOX */
.check-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px; border: var(--border); border-radius: 8px;
  margin-bottom: 8px; cursor: pointer; background: var(--surface);
  box-shadow: var(--shadow);
}
.check-row.checked { background: #e8ffe8; }
body[data-theme="dark"] .check-row.checked { background: #102a16; }
.check-box {
  width: 24px; height: 24px; border: var(--border); border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  background: var(--white); flex-shrink: 0;
}
.check-box.checked { background: var(--green); }

.theme-toggle {
  min-width: 42px; height: 36px; padding: 0;
  justify-content: center;
}
body[data-theme="dark"] .card,
body[data-theme="dark"] .lesson-card,
body[data-theme="dark"] .stat-card,
body[data-theme="dark"] .student-item,
body[data-theme="dark"] .modal,
body[data-theme="dark"] .input,
body[data-theme="dark"] .toggle-opt,
body[data-theme="dark"] .check-row,
body[data-theme="dark"] .check-box,
body[data-theme="dark"] .day-btn {
  background: #1e1c18;
  color: #f1eadb;
}
body[data-theme="dark"] .lesson-time,
body[data-theme="dark"] .card-header,
body[data-theme="dark"] .toggle-opt.active,
body[data-theme="dark"] .day-btn.active {
  background: #29251b;
  color: #dec35a;
}
body[data-theme="dark"] .lesson-tag,
body[data-theme="dark"] .badge {
  border-color: rgba(238,230,216,.82);
}
body[data-theme="dark"] .lesson-card,
body[data-theme="dark"] .card,
body[data-theme="dark"] .stat-card,
body[data-theme="dark"] .student-item {
  box-shadow: 0 10px 28px rgba(0,0,0,.24);
}
body[data-theme="dark"] .modal {
  background: #1e1c18;
  border-color: rgba(241,234,219,.55);
}
body[data-theme="dark"] .modal-overlay {
  background: rgba(0,0,0,.72);
}
body[data-theme="dark"] .input,
body[data-theme="dark"] .check-box {
  background: #181713;
}
body[data-theme="dark"] .toggle-row {
  border-color: rgba(238,230,216,.7);
}
body[data-theme="dark"] .fab {
  border-color: rgba(238,230,216,.85);
}
body[data-theme="dark"] .badge-red {
  background:#743333;
  color:#fff0ed;
}
body[data-theme="dark"] .badge-green {
  background:#2e6247;
  color:#eefaf2;
}
body[data-theme="dark"] .badge-yellow {
  background:#9b8438;
  color:#15120a;
}

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }
@keyframes slideDown { from { transform:translateX(-50%) translateY(-80px); opacity:0; } to { transform:translateX(-50%) translateY(0); opacity:1; } }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes modalPop { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(0,200,83,.4)} 50%{box-shadow:0 0 0 10px rgba(0,200,83,0)} }
@keyframes fabPop { from{transform:scale(0) translateY(20px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
.anim-in { animation: fadeIn .25s ease both; }
.anim-stagger-1 { animation-delay:.03s }
.anim-stagger-2 { animation-delay:.06s }
.anim-stagger-3 { animation-delay:.09s }
.anim-stagger-4 { animation-delay:.12s }
.anim-stagger-5 { animation-delay:.15s }
.timer-pulse { animation: pulse 2s infinite; }

/* ── RESPONSIVE: PC ── */
@media(min-width:769px){
  .navbar{position:fixed;top:0;bottom:auto;left:0;right:0;border-top:none;border-bottom:var(--border);justify-content:center;gap:0}
  .nav-btn{flex:0 0 auto;padding:14px 28px;flex-direction:row;gap:8px;font-size:11px}
  .nav-btn svg{width:18px;height:18px}
  .main{max-width:1180px;padding:76px 28px 32px}
  .fab{bottom:32px;right:32px}
  .modal-overlay{align-items:center}
  .modal{max-width:560px;border-radius:8px;border:var(--border);max-height:85vh;animation:modalPop .2s ease}
  .stat-row{grid-template-columns:repeat(4,1fr)}
  .lesson-card .lesson-actions button:not(.btn){opacity:0;transition:opacity .15s}
  .lesson-card:hover .lesson-actions button{opacity:1}
}
@media(min-width:1025px){
  .main{max-width:1280px}
  .sched-desktop table{min-width:1080px!important}
  .sched-desktop td>div{min-height:92px}
  .crm-dashboard{grid-template-columns:repeat(6,1fr)}
}

/* ── RESPONSIVE: MOBILE ── */
@media(max-width:768px){
  .sched-desktop{display:none!important}
  .sched-mobile{display:block!important}
  .btn-sm{min-height:40px;padding:10px 12px}
  .today-desktop-grid{display:block!important}
  .day-strip{gap:4px}
  .day-btn{min-width:40px!important;padding:6px 2px}
  .day-btn-name{font-size:9px}
  .day-btn-date{font-size:13px}
}
@media(min-width:769px){
  .sched-mobile{display:none!important}
  .sched-desktop{display:block!important}
  .today-desktop-grid{display:grid!important;grid-template-columns:3fr 2fr;gap:24px;align-items:start}
}

/* ── FAB EXPANDED ── */
.fab-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:97}
.fab-menu{position:fixed;right:16px;bottom:140px;display:flex;flex-direction:column;gap:10px;z-index:98}
@media(min-width:769px){.fab-menu{bottom:96px;right:32px}}
.fab-item{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:4px;border:var(--border);box-shadow:var(--shadow);cursor:pointer;font-family:'Unbounded',cursive;font-size:11px;font-weight:700;white-space:nowrap}
.fab-item:nth-child(1){animation:fabPop .2s ease both;animation-delay:.0s}
.fab-item:nth-child(2){animation:fabPop .2s ease both;animation-delay:.05s}
.fab-item:nth-child(3){animation:fabPop .2s ease both;animation-delay:.1s}
.fab-item:nth-child(4){animation:fabPop .2s ease both;animation-delay:.15s}

/* ── TIMER BANNER ── */
.timer-banner{border:var(--border);border-radius:4px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;background:var(--green);box-shadow:var(--shadow)}
.timer-bar{height:6px;background:rgba(0,0,0,.15);border-radius:3px;flex:1;overflow:hidden}
.timer-fill{height:100%;background:var(--black);border-radius:3px;transition:width 1s linear}

/* ── GLOBAL SEARCH ── */
.search-overlay{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.5)}
.search-panel{position:fixed;top:0;left:0;right:0;z-index:251;background:var(--white);border-bottom:var(--border);padding:12px 16px;box-shadow:var(--shadow-lg)}
@media(min-width:769px){.search-panel{left:50%;right:auto;transform:translateX(-50%);width:600px;top:8px;border-radius:8px;border:var(--border)}}
.search-result{padding:10px 12px;border-bottom:1px solid var(--border-light);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .1s}
.search-result:hover{background:var(--bg-subtle)}

/* ── NOTIFICATION ── */
.notif-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--white)}

/* ── SWIPE SCHEDULE ── */
.sched-swipe{touch-action:pan-y;overflow:hidden}

/* ── CRM POLISH ── */
.empty-state{
  border:1px dashed var(--border-dashed);
  border-radius:10px;
  background:color-mix(in srgb, var(--surface) 92%, var(--blue) 8%);
  padding:22px;
  text-align:center;
  margin-bottom:12px;
}
.empty-state-title{font-family:'Unbounded',cursive;font-size:14px;font-weight:900;margin-bottom:8px}
.empty-state-text{font-size:12px;color:var(--text-sec);line-height:1.6;margin-bottom:14px}
.detail-tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px;scrollbar-width:none}
.detail-tabs::-webkit-scrollbar{display:none}
.detail-tab{white-space:nowrap;border:var(--border);border-radius:999px;background:var(--surface);padding:7px 11px;font-family:'Unbounded',cursive;font-size:10px;font-weight:700;cursor:pointer;color:var(--black)}
.detail-tab.active{background:var(--black);color:var(--yellow);border-color:var(--black)}
.crm-dashboard{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.crm-table-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-light)}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;color:var(--text-sec);border-radius:7px}
.icon-btn:hover{background:var(--bg-subtle);color:var(--black)}
.metric-card{
  border:var(--border);
  border-radius:10px;
  padding:12px 14px;
  box-shadow:var(--shadow);
  background:var(--surface);
  min-width:0;
}
.metric-card.accent{background:color-mix(in srgb, var(--metric-bg) 11%, var(--surface));border-color:color-mix(in srgb, var(--metric-bg) 34%, var(--border-light))}
.metric-label{font-family:'Unbounded',cursive;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-sec);margin-bottom:5px}
.metric-value{font-family:'Unbounded',cursive;font-size:20px;font-weight:900;line-height:1;color:var(--black)}
.metric-sub{font-size:10px;color:var(--text-sec);margin-top:4px}
.finance-panel{
  border:var(--border);
  border-radius:5px;
  padding:14px;
  background:var(--surface);
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.forecast-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.forecast-card{border:var(--border);border-radius:10px;padding:14px;background:var(--surface)}
.forecast-card.good{background:var(--bg-success);border-color:color-mix(in srgb, var(--green) 35%, var(--border-light))}
.forecast-card.warn{background:var(--bg-subtle);border-color:color-mix(in srgb, var(--yellow) 45%, var(--border-light))}
.schedule-grid-wrap{overflow-x:auto;margin-left:-16px;margin-right:-16px;padding:0 16px 6px}
.schedule-table{border-collapse:separate;border-spacing:7px;min-width:1080px;width:100%;table-layout:fixed}
.schedule-head-cell{height:64px;text-align:center;padding:9px 6px;cursor:pointer;border:var(--border);border-radius:5px;background:var(--surface);box-shadow:var(--shadow);font-family:'Unbounded',cursive;font-weight:900}
.schedule-head-cell.today{background:var(--black);color:var(--yellow);border-color:var(--black)}
.schedule-head-cell.selected:not(.today){background:var(--bg-subtle);border-color:color-mix(in srgb, var(--yellow) 65%, var(--border-light))}
.schedule-time-cell{text-align:right;font-family:'Unbounded',cursive;font-size:13px;font-weight:800;color:var(--text-sec);vertical-align:middle;padding-right:8px;width:64px}
.schedule-empty-cell{height:92px;border:2px dashed var(--border-dashed);border-radius:5px;cursor:pointer;background:color-mix(in srgb, var(--surface) 80%, var(--white) 20%)}
.schedule-empty-cell:hover{background:var(--bg-subtle)}
.schedule-lesson-cell{min-height:92px;border:var(--border);border-radius:5px;padding:10px;font-size:13px;font-family:'Inter',sans-serif;font-weight:700;line-height:1.35;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;gap:8px;position:relative}
.schedule-lesson-cell[draggable="true"]{cursor:grab}
.schedule-lesson-cell[draggable="true"]:active{cursor:grabbing}
.schedule-lesson-cell.conflict{border-color:var(--yellow);box-shadow:0 0 0 2px color-mix(in srgb, var(--yellow) 45%, transparent), var(--shadow)}
.schedule-lesson-cell.planned.group{background:color-mix(in srgb, var(--blue) 13%, var(--surface));border-color:color-mix(in srgb, var(--blue) 38%, var(--border-light));color:var(--black)}
.schedule-lesson-cell.planned.individual{background:var(--bg-subtle);border-color:color-mix(in srgb, var(--yellow) 50%, var(--border-light));color:var(--black)}
.schedule-lesson-cell.done{background:var(--done-bg);color:var(--done-text);box-shadow:none}
.schedule-lesson-title{font-size:14px;font-weight:800;word-break:normal;overflow-wrap:anywhere}
.schedule-lesson-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:var(--text-sec);font-family:'Inter',sans-serif;font-weight:700}
.finance-chart-panel{max-width:680px;margin-right:auto}
.finance-chart-scroll{overflow-x:auto;padding:2px 2px 0}
.finance-chart-svg{display:block;width:100%;max-width:560px;margin:0 auto}
.finance-chart-svg.weekly{max-width:480px}
.finance-chart-svg.days{max-width:520px}
@media(min-width:769px){
  .finance-chart-panel{padding:12px 14px}
  .finance-chart-svg.weekly{max-width:420px}
  .finance-chart-svg.days{max-width:460px}
}
body[data-theme="dark"] .empty-state{background:#1a1f22}
body[data-theme="dark"] .icon-btn:hover{background:#29251b}
body[data-theme="dark"] .metric-card.accent{background:color-mix(in srgb, var(--metric-bg) 14%, #1e1c18);border-color:color-mix(in srgb, var(--metric-bg) 30%, var(--border-light))}
body[data-theme="dark"] .forecast-card.good{background:#1a271e}
body[data-theme="dark"] .forecast-card.warn{background:#29251b}
body[data-theme="dark"] .schedule-head-cell{background:#1e1c18;color:#f1eadb}
body[data-theme="dark"] .schedule-head-cell.today{background:#29251b;color:#dec35a}
body[data-theme="dark"] .schedule-head-cell.selected:not(.today){background:#2c2618}
body[data-theme="dark"] .schedule-empty-cell{background:#191813}
body[data-theme="dark"] .schedule-lesson-cell.planned.group{background:#20263a;border-color:#4d5c82;color:#f3f5ff}
body[data-theme="dark"] .schedule-lesson-cell.planned.individual{background:#2a2518;border-color:#7a682f;color:#fff0c6}
body[data-theme="dark"] .schedule-lesson-meta{color:#c5bcad}
@media(min-width:1025px){
  .crm-dashboard{grid-template-columns:repeat(6,1fr)}
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="./app.js"></script>
</body>
</html>
